<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<title>Irmandade do Asfalto</title>

<link rel="manifest" href='data:application/json,{
"name":"Irmandade do Asfalto",
"short_name":"Asfalto",
"display":"standalone",
"background_color":"#050302",
"theme_color":"#e06c2e"
}'>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050302;
color:white;
min-height:100vh;
}

:root{
--orange:#e06c2e;
--card:#16110d;
}

.hidden{
display:none;
}

.screen{
padding:20px;
}

.card{
background:var(--card);
border:1px solid rgba(224,108,46,.3);
border-radius:24px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(224,108,46,.1);
}

.title{
font-size:32px;
font-weight:bold;
color:var(--orange);
margin-bottom:10px;
text-align:center;
}

.subtitle{
text-align:center;
opacity:.7;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:14px;
background:#241a14;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:14px;
background:var(--orange);
font-weight:bold;
cursor:pointer;
color:#050302;
}

button.secondary{
background:#2c2119;
color:white;
}

.token-box{
text-align:center;
padding:25px;
border-radius:24px;
background:linear-gradient(135deg,#2b1c12,#120d09);
margin-bottom:20px;
}

.token-value{
font-size:52px;
font-weight:bold;
color:var(--orange);
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#120d09;
display:flex;
padding:10px;
border-top:1px solid rgba(224,108,46,.3);
}

.nav button{
margin:4px;
font-size:12px;
}

.note{
background:#21160f;
padding:14px;
border-radius:16px;
margin-top:10px;
}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:20px;
font-size:12px;
margin-top:8px;
background:#2e2219;
}

.admin{
background:#3b2516;
}

.rpg{
font-size:14px;
opacity:.8;
margin-top:5px;
}

</style>
</head>
<body>

<div id="loginScreen" class="screen">

<div class="card">

<div class="title">🔥 IRMANDADE</div>

<div class="subtitle">
MVP RPG • Moto Clube
</div>

<input id="email" type="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Senha">

<button onclick="login()">ENTRAR</button>

<button class="secondary" onclick="register()">
CRIAR CONTA
</button>

</div>

</div>

<div id="app" class="screen hidden">

<div class="token-box">
<div id="welcomeName">Motoboy</div>

<div class="token-value" id="tokens">0</div>

<div class="rpg">
🔥 TOKENS DA IRMANDADE
</div>

<div id="adminBadge"></div>
</div>

<div id="homeView">

<div class="card">

<h2>⚔️ Painel</h2>

<button onclick="openView('perfilView')">
👤 Perfil
</button>

<button onclick="openView('notaView')">
🧾 Enviar Nota
</button>

<button onclick="openView('rankingView')">
🏆 Ranking
</button>

<button onclick="openView('missoesView')">
🎯 Missões
</button>

<button onclick="openView('adminView')" id="adminButton" class="hidden">
👑 Administração
</button>

<button class="secondary" onclick="logout()">
🚪 Sair
</button>

</div>

</div>

<div id="perfilView" class="hidden">

<div class="card">

<h2>👤 Perfil</h2>

<input id="perfilNome" placeholder="Seu nome">

<button onclick="saveProfile()">
💾 Salvar
</button>

<button class="secondary" onclick="backHome()">
⬅️ Voltar
</button>

</div>

</div>

<div id="notaView" class="hidden">

<div class="card">

<h2>🧾 Nota Fiscal</h2>

<input id="valorNota" type="number" placeholder="Valor da nota">

<input id="imagemNota" type="file" accept="image/*">

<button onclick="sendNote()">
📤 Enviar Nota
</button>

<button class="secondary" onclick="backHome()">
⬅️ Voltar
</button>

</div>

<div id="minhasNotas"></div>

</div>

<div id="rankingView" class="hidden">

<div class="card">

<h2>🏆 Ranking</h2>

<div id="rankingList"></div>

<button class="secondary" onclick="backHome()">
⬅️ Voltar
</button>

</div>

</div>

<div id="missoesView" class="hidden">

<div class="card">

<h2>🎯 Missões</h2>

<div class="note">
🔥 Fazer login diário
</div>

<div class="note">
🧾 Enviar nota fiscal
</div>

<div class="note">
🏍️ Participar da comunidade
</div>

<button class="secondary" onclick="backHome()">
⬅️ Voltar
</button>

</div>

</div>

<div id="adminView" class="hidden">

<div class="card admin">

<h2>👑 Administração</h2>

<h3>Notas Pendentes</h3>

<div id="adminNotas"></div>

<hr style="margin:20px 0;border-color:#333;">

<h3>💰 Cunhar Tokens</h3>

<input id="mintEmail" placeholder="E-mail">

<input id="mintAmount" type="number" placeholder="Quantidade">

<button onclick="mintTokens()">
🔥 Cunhar
</button>

<button class="secondary" onclick="backHome()">
⬅️ Voltar
</button>

</div>

</div>

</div>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8",
authDomain: "clube-de-vantagens-d748e.firebaseapp.com",
projectId: "clube-de-vantagens-d748e",
storageBucket: "clube-de-vantagens-d748e.firebasestorage.app",
messagingSenderId: "774730191238",
appId: "1:774730191238:web:9af24eddfafb18f1351c07",
measurementId: "G-8V0WCRB0QQ"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;
let currentData = null;

function toast(msg){
alert(msg);
}

async function register(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if(!email || !password){
return toast("Preencha tudo");
}

try{

const cred = await auth.createUserWithEmailAndPassword(email,password);

const users = await db.collection("perfis").get();

const isFirst =
users.empty ||
email === "cristophersmonteiro357@gmail.com";

await db.collection("perfis")
.doc(cred.user.uid)
.set({
nome: email.split("@")[0],
email,
tokens:0,
isAdmin:isFirst,
criadoEm: firebase.firestore.FieldValue.serverTimestamp()
});

toast("Conta criada");

}catch(e){
toast(e.message);
}

}

async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

await auth.signInWithEmailAndPassword(
email,
password
);

}catch(e){
toast(e.message);
}

}

function logout(){
auth.signOut();
}

auth.onAuthStateChanged(async user=>{

if(user){

currentUser = user;

const doc = await db
.collection("perfis")
.doc(user.uid)
.get();

currentData = doc.data();

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

render();

}else{

document.getElementById("loginScreen")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

}

});

function render(){

document.getElementById("welcomeName")
.innerText = currentData.nome;

document.getElementById("tokens")
.innerText = currentData.tokens || 0;

document.getElementById("perfilNome")
.value = currentData.nome || "";

if(currentData.isAdmin){

document.getElementById("adminButton")
.classList.remove("hidden");

document.getElementById("adminBadge")
.innerHTML =
'<div class="badge">👑 ADMIN</div>';

loadAdminNotes();

}

loadMyNotes();
loadRanking();

}

async function saveProfile(){

const nome =
document.getElementById("perfilNome").value;

await db.collection("perfis")
.doc(currentUser.uid)
.update({
nome
});

currentData.nome = nome;

toast("Perfil salvo");

render();

}

async function sendNote(){

const valor =
parseFloat(document.getElementById("valorNota").value);

const file =
document.getElementById("imagemNota").files[0];

if(!valor || !file){
return toast("Preencha tudo");
}

try{

const ref =
storage.ref("notas/" + Date.now());

await ref.put(file);

const imagemURL =
await ref.getDownloadURL();

await db.collection("notas").add({
uid: currentUser.uid,
nome: currentData.nome,
valor,
imagemURL,
status:"pendente",
criadoEm:
firebase.firestore.FieldValue.serverTimestamp()
});

toast("Nota enviada");

document.getElementById("valorNota").value = "";

loadMyNotes();

}catch(e){
toast(e.message);
}

}

async function loadMyNotes(){

const snap = await db
.collection("notas")
.where("uid","==",currentUser.uid)
.get();

document.getElementById("minhasNotas")
.innerHTML =
snap.docs.map(doc=>{

const n = doc.data();

return `
<div class="note">
🧾 R$ ${n.valor}
<br>
<span class="badge">
${n.status}
</span>
</div>
`;

}).join("");

}

async function loadRanking(){

const snap = await db
.collection("perfis")
.orderBy("tokens","desc")
.limit(10)
.get();

document.getElementById("rankingList")
.innerHTML =
snap.docs.map((doc,i)=>{

const u = doc.data();

return `
<div class="note">
#${i+1} 🔥 ${u.nome}
<br>
${u.tokens} tokens
</div>
`;

}).join("");

}

async function loadAdminNotes(){

const snap = await db
.collection("notas")
.where("status","==","pendente")
.get();

document.getElementById("adminNotas")
.innerHTML =
snap.docs.map(doc=>{

const n = doc.data();

return `
<div class="note">

🧾 ${n.nome}
<br>
R$ ${n.valor}

<br><br>

<img src="${n.imagemURL}"
style="width:100%;border-radius:12px;">

<button onclick="approveNote('${doc.id}',${n.valor},'${n.uid}')">
✅ Aprovar
</button>

<button onclick="rejectNote('${doc.id}')"
class="secondary">
❌ Rejeitar
</button>

</div>
`;

}).join("");

}

async function approveNote(id,valor,uid){

const tokens = Math.floor(valor * 10);

await db.collection("notas")
.doc(id)
.update({
status:"aprovada"
});

await db.collection("perfis")
.doc(uid)
.update({
tokens:
firebase.firestore.FieldValue.increment(tokens)
});

toast("Nota aprovada");

loadAdminNotes();

}

async function rejectNote(id){

await db.collection("notas")
.doc(id)
.update({
status:"rejeitada"
});

toast("Nota rejeitada");

loadAdminNotes();

}

async function mintTokens(){

const email =
document.getElementById("mintEmail").value;

const amount =
parseInt(document.getElementById("mintAmount").value);

const snap = await db
.collection("perfis")
.where("email","==",email)
.get();

if(snap.empty){
return toast("Usuário não encontrado");
}

await snap.docs[0].ref.update({
tokens:
firebase.firestore.FieldValue.increment(amount)
});

toast("Tokens enviados");

}

function openView(id){

[
"homeView",
"perfilView",
"notaView",
"adminView",
"rankingView",
"missoesView"
].forEach(v=>{

document.getElementById(v)
.classList.add("hidden");

});

document.getElementById(id)
.classList.remove("hidden");

}

function backHome(){
openView("homeView");
}

if("serviceWorker" in navigator){

navigator.serviceWorker.register(

URL.createObjectURL(

new Blob([`

self.addEventListener('install',e=>{
self.skipWaiting();
});

self.addEventListener('activate',e=>{
clients.claim();
});

`],{
type:"text/javascript"
})

)

);

}

</script>

</body>
</html>
