<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irmandade da Estrada</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial; padding: 20px; }
        .btn { padding: 10px; margin: 5px; background: #e06c2e; color: white; border: none; cursor: pointer; }
        input { padding: 10px; margin: 5px; width: 90%; }
        .card { background: #2a2a2a; padding: 20px; margin: 10px 0; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <h2>IRMANDADE DA ESTRADA</h2>
        <input type="email" id="emailInput" placeholder="Email" value="cristophersmonteiro357@gmail.com">
        <input type="password" id="passInput" placeholder="Senha">
        <button class="btn" onclick="login()">ENTRAR</button>
        <button class="btn" onclick="register()">CRIAR CONTA</button>
    </div>

    <div id="appScreen" style="display:none;">
        <h2>Bem-vindo, <span id="userName"></span>!</h2>
        <div class="card">
            <p>Tokens: <strong id="credits">0</strong> 🔥</p>
            <p>Confiança: <strong id="trust">0</strong></p>
        </div>
        <button class="btn" onclick="addTokens()">Ganhar 10 Tokens</button>
        <button class="btn" onclick="logout()">SAIR</button>
        <div id="debug"></div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8",
            authDomain: "clube-de-vantagens-d748e.firebaseapp.com",
            projectId: "clube-de-vantagens-d748e",
            storageBucket: "clube-de-vantagens-d748e.firebasestorage.app",
            messagingSenderId: "774730191238",
            appId: "1:774730191238:web:9af24eddfafb18f1351c07"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // Função de debug
        function debug(msg) {
            document.getElementById('debug').innerHTML += '<br>' + msg;
            console.log(msg);
        }

        // Login
        window.login = async function() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            
            try {
                debug('Tentando login...');
                const result = await auth.signInWithEmailAndPassword(email, pass);
                debug('Login OK: ' + result.user.uid);
                
                // Buscar dados do perfil
                const doc = await db.collection('perfis').doc(result.user.uid).get();
                
                if (doc.exists) {
                    debug('Perfil encontrado!');
                    currentUser = { uid: result.user.uid, ...doc.data() };
                    mostrarApp();
                } else {
                    debug('Perfil não encontrado, criando...');
                    await db.collection('perfis').doc(result.user.uid).set({
                        email: email,
                        credits: 100,
                        trust: 0,
                        nome: email.split('@')[0],
                        createdAt: new Date()
                    });
                    currentUser = { uid: result.user.uid, email: email, credits: 100, trust: 0, nome: email.split('@')[0] };
                    mostrarApp();
                }
            } catch (error) {
                debug('ERRO: ' + error.message);
                alert('Erro: ' + error.message);
            }
        };

        // Registro
        window.register = async function() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            
            try {
                debug('Criando conta...');
                const result = await auth.createUserWithEmailAndPassword(email, pass);
                debug('Conta criada: ' + result.user.uid);
                
                // Criar perfil
                await db.collection('perfis').doc(result.user.uid).set({
                    email: email,
                    credits: 100,
                    trust: 0,
                    nome: email.split('@')[0],
                    createdAt: new Date()
                });
                
                debug('Perfil criado com sucesso!');
                currentUser = { uid: result.user.uid, email: email, credits: 100, trust: 0, nome: email.split('@')[0] };
                mostrarApp();
            } catch (error) {
                debug('ERRO: ' + error.message);
                alert('Erro: ' + error.message);
            }
        };

        // Mostrar app
        function mostrarApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            document.getElementById('userName').textContent = currentUser.nome;
            document.getElementById('credits').textContent = currentUser.credits;
            document.getElementById('trust').textContent = currentUser.trust;
            debug('App carregado com sucesso!');
        }

        // Adicionar tokens
        window.addTokens = async function() {
            try {
                await db.collection('perfis').doc(currentUser.uid).update({
                    credits: firebase.firestore.FieldValue.increment(10)
                });
                currentUser.credits += 10;
                document.getElementById('credits').textContent = currentUser.credits;
                debug('+10 tokens adicionados!');
            } catch (error) {
                debug('ERRO ao adicionar tokens: ' + error.message);
            }
        };

        // Logout
        window.logout = function() {
            auth.signOut();
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
            currentUser = null;
            debug('Logout realizado');
        };

        // Verificar estado da autenticação
        auth.onAuthStateChanged(async function(user) {
            if (user) {
                debug('Usuário já autenticado: ' + user.uid);
                const doc = await db.collection('perfis').doc(user.uid).get();
                if (doc.exists) {
                    currentUser = { uid: user.uid, ...doc.data() };
                    mostrarApp();
                }
            }
        });

        debug('Sistema inicializado. Aguardando ação...');
    </script>
</body>
</html>
