<script>

const firebaseConfig = {
apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8",
authDomain: "clube-de-vantagens-d748e.firebaseapp.com",
projectId: "clube-de-vantagens-d748e",
storageBucket: "clube-de-vantagens-d748e.firebasestorage.app",
messagingSenderId: "774730191238",
appId: "1:774730191238:web:9af24eddfafb18f1351c07",
measurementId: "G-8V0WCRB0QQ"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;
let currentData = null;

function toast(msg){
alert(msg);
}

function safe(v, fallback=""){
return v ?? fallback;
}

async function register(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
return toast("Preencha email e senha");
}

if(password.length < 6){
return toast("Senha mínima: 6 caracteres");
}

try{

const cred =
await auth.createUserWithEmailAndPassword(
email,
password
);

const users =
await db.collection("perfis").limit(1).get();

const isAdmin =
email === "cristophersmonteiro357@gmail.com" ||
users.empty;

await db.collection("perfis")
.doc(cred.user.uid)
.set({
nome: email.split("@")[0],
email: email,
tokens: 0,
isAdmin: isAdmin,
criadoEm:
firebase.firestore.FieldValue.serverTimestamp()
});

toast("Conta criada com sucesso");

}catch(e){

console.error(e);
toast(e.message);

}

}

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
return toast("Preencha email e senha");
}

try{

await auth.signInWithEmailAndPassword(
email,
password
);

}catch(e){

console.error(e);

if(e.code === "auth/user-not-found"){
toast("Usuário não encontrado");
}
else if(e.code === "auth/wrong-password"){
toast("Senha incorreta");
}
else{
toast(e.message);
}

}

}

function logout(){
auth.signOut();
}

auth.onAuthStateChanged(async user=>{

try{

if(user){

currentUser = user;

const ref =
db.collection("perfis").doc(user.uid);

let doc = await ref.get();

if(!doc.exists){

await ref.set({
nome: user.email.split("@")[0],
email: user.email,
tokens: 0,
isAdmin:
user.email === "cristophersmonteiro357@gmail.com",
criadoEm:
firebase.firestore.FieldValue.serverTimestamp()
});

doc = await ref.get();

}

currentData = doc.data();

document.getElementById("loginScreen")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

render();

}else{

document.getElementById("loginScreen")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

currentUser = null;
currentData = null;

}

}catch(e){

console.error(e);
toast("Erro ao carregar usuário");

}

});

function render(){

if(!currentData) return;

document.getElementById("welcomeName")
.innerText = safe(currentData.nome,"Motoboy");

document.getElementById("tokens")
.innerText = safe(currentData.tokens,0);

document.getElementById("perfilNome")
.value = safe(currentData.nome);

if(currentData.isAdmin){

document.getElementById("adminButton")
.classList.remove("hidden");

document.getElementById("adminBadge")
.innerHTML =
'<div class="badge">👑 ADMIN</div>';

loadAdminNotes();

}else{

document.getElementById("adminButton")
.classList.add("hidden");

}

loadMyNotes();
loadRanking();

}

async function saveProfile(){

try{

const nome =
document.getElementById("perfilNome")
.value.trim();

if(!nome){
return toast("Digite um nome");
}

await db.collection("perfis")
.doc(currentUser.uid)
.update({
nome
});

currentData.nome = nome;

toast("Perfil atualizado");

}catch(e){

console.error(e);
toast("Erro ao salvar");

}

}

async function sendNote(){

try{

const valor =
parseFloat(
document.getElementById("valorNota").value
);

const file =
document.getElementById("imagemNota").files[0];

if(!valor || valor <= 0){
return toast("Valor inválido");
}

if(!file){
return toast("Selecione uma imagem");
}

const fileName =
Date.now() + "_" + file.name;

const ref =
storage.ref("notas/" + fileName);

await ref.put(file);

const imagemURL =
await ref.getDownloadURL();

await db.collection("notas").add({
uid: currentUser.uid,
nome: safe(currentData.nome),
valor,
imagemURL,
status:"pendente",
criadoEm:
firebase.firestore.FieldValue.serverTimestamp()
});

document.getElementById("valorNota").value = "";
document.getElementById("imagemNota").value = "";

toast("Nota enviada");

loadMyNotes();

}catch(e){

console.error(e);
toast("Erro ao enviar nota");

}

}

async function loadMyNotes(){

try{

const snap = await db
.collection("notas")
.where("uid","==",currentUser.uid)
.get();

document.getElementById("minhasNotas")
.innerHTML = snap.docs.map(doc=>{

const n = doc.data();

return `
<div class="note">
🧾 R$ ${safe(n.valor,0)}

<br>

<span class="badge">
${safe(n.status,"pendente")}
</span>
</div>
`;

}).join("");

}catch(e){

console.error(e);

}

}

async function loadRanking(){

try{

const snap = await db
.collection("perfis")
.orderBy("tokens","desc")
.limit(10)
.get();

document.getElementById("rankingList")
.innerHTML = snap.docs.map((doc,i)=>{

const u = doc.data();

return `
<div class="note">
#${i+1} 🔥 ${safe(u.nome,"Usuário")}
<br>
${safe(u.tokens,0)} tokens
</div>
`;

}).join("");

}catch(e){

console.error(e);

}

}

async function loadAdminNotes(){

try{

const snap = await db
.collection("notas")
.where("status","==","pendente")
.get();

document.getElementById("adminNotas")
.innerHTML = snap.docs.map(doc=>{

const n = doc.data();

return `
<div class="note">

🧾 ${safe(n.nome)}

<br>

R$ ${safe(n.valor,0)}

<br><br>

<img
src="${safe(n.imagemURL)}"
style="
width:100%;
border-radius:12px;
margin-bottom:10px;
">

<button
onclick="approveNote(
'${doc.id}',
${safe(n.valor,0)},
'${safe(n.uid)}'
)">
✅ Aprovar
</button>

<button
class="secondary"
onclick="rejectNote('${doc.id}')">
❌ Rejeitar
</button>

</div>
`;

}).join("");

}catch(e){

console.error(e);

}

}

async function approveNote(id,valor,uid){

try{

const tokens =
Math.floor(valor * 10);

await db.collection("notas")
.doc(id)
.update({
status:"aprovada"
});

await db.collection("perfis")
.doc(uid)
.update({
tokens:
firebase.firestore.FieldValue.increment(tokens)
});

toast("Nota aprovada");

loadAdminNotes();

}catch(e){

console.error(e);
toast("Erro ao aprovar");

}

}

async function rejectNote(id){

try{

await db.collection("notas")
.doc(id)
.update({
status:"rejeitada"
});

toast("Nota rejeitada");

loadAdminNotes();

}catch(e){

console.error(e);

}

}

async function mintTokens(){

try{

const email =
document.getElementById("mintEmail")
.value.trim();

const amount =
parseInt(
document.getElementById("mintAmount").value
);

if(!email){
return toast("Digite email");
}

if(!amount || amount <= 0){
return toast("Quantidade inválida");
}

const snap =
await db.collection("perfis")
.where("email","==",email)
.get();

if(snap.empty){
return toast("Usuário não encontrado");
}

await snap.docs[0].ref.update({
tokens:
firebase.firestore.FieldValue.increment(amount)
});

toast("Tokens enviados");

document.getElementById("mintEmail").value="";
document.getElementById("mintAmount").value="";

}catch(e){

console.error(e);
toast("Erro ao cunhar");

}

}

function openView(id){

[
"homeView",
"perfilView",
"notaView",
"adminView",
"rankingView",
"missoesView"
].forEach(v=>{

document.getElementById(v)
.classList.add("hidden");

});

document.getElementById(id)
.classList.remove("hidden");

}

function backHome(){
openView("homeView");
}

if("serviceWorker" in navigator){

navigator.serviceWorker.register(

URL.createObjectURL(

new Blob([`

self.addEventListener('install',e=>{
self.skipWaiting();
});

self.addEventListener('activate',e=>{
clients.claim();
});

`],{
type:"text/javascript"
})

)

);

}

</script>
