<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Irmandade da Estrada · MotoClube</title>
    <link rel="manifest" href="data:application/manifest+json,{ \"name\": \"Irmandade da Estrada\", \"short_name\": \"MotoClube\", \"start_url\": \".\", \"display\": \"standalone\", \"theme_color\": \"#e06c2e\", \"background_color\": \"#050302\" }">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --bg-deep: #050302; --ember: #e06c2e; --ember-bright: #ff8c4a; --gold: #d4af37; --text-primary: #f5ede0; --text-muted: #8a7a6a; --border-ember: rgba(224,108,46,0.4); --safe-bottom: env(safe-area-inset-bottom, 16px); }
        body { background: #050302; color: #f5ede0; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
        .toast-stack { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 400; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px; border-radius: 16px; background: #1f1a14e6; backdrop-filter: blur(10px); border-left: 4px solid #e06c2e; animation: fadeIn 0.2s; color: white; }
        .toast-error { border-left-color: #c55a3a; background: #2a1a14e6; }
        .toast-success { border-left-color: #2e7d32; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; } }
        #app { display: none; flex-direction: column; height: 100%; position: relative; z-index: 2; }
        .topbar { padding: 12px 16px; display: flex; justify-content: space-between; background: rgba(5,3,2,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(224,108,46,0.4); }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; }
        .logo i { font-size: 28px; color: #e06c2e; }
        .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
        .view { display: none; flex-direction: column; gap: 20px; }
        .view.active { display: flex; }
        .card { background: rgba(26,21,18,0.85); backdrop-filter: blur(8px); border-radius: 28px; padding: 20px; border: 1px solid rgba(224,108,46,0.4); }
        .btn { border: none; border-radius: 40px; padding: 10px 20px; font-weight: 600; cursor: pointer; background: #241e1a; color: #f5ede0; border: 1px solid rgba(224,108,46,0.4); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-primary { background: linear-gradient(135deg, #b9591f, #e06c2e); color: #0a0502; border: none; }
        .btn-outline { background: transparent; border: 1px solid #e06c2e; color: #ff8c4a; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
        .stats-row { display: flex; justify-content: space-between; background: #1a1512; border-radius: 40px; padding: 12px; margin-top: 8px; }
        .avatar-circle { width: 56px; height: 56px; background: #2e241f; border-radius: 50%; border: 2px solid #e06c2e; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .grid-2col { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin: 8px 0; text-align: center; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,3,2,0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 16px)); border-top: 1px solid rgba(224,108,46,0.4); z-index: 20; }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: #8a7a6a; font-size: 0.7rem; padding: 6px; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #ff8c4a; }
        input, select, textarea { width: 100%; padding: 12px; background: #1c140f; border: 1px solid #3a2a20; border-radius: 20px; color: white; margin: 6px 0; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-full { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 300; flex-direction: column; gap: 16px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="toast-stack" id="toastStack"></div>

<div id="loginOverlay" style="position:fixed; inset:0; background:#050302; display:flex; align-items:center; justify-content:center; z-index:200;">
    <div class="card" style="max-width:380px; width:90%; text-align:center;">
        <div style="font-size:70px;">💀</div>
        <h2 style="color:#ff8c4a; margin:8px 0;">IRMANDADE DA ESTRADA</h2>
        <p style="color:#8a7a6a;">MotoClube · Economia Tokens</p>
        <input type="text" id="emailLogin" placeholder="E-mail ou CPF">
        <input type="password" id="senhaLogin" placeholder="Senha">
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn btn-primary" style="flex:1" id="loginBtn">ENTRAR</button>
            <button class="btn btn-outline" style="flex:1" id="registerBtn">CRIAR CONTA</button>
        </div>
    </div>
</div>

<div id="loadingData" style="display:none;" class="loading-full">
    <div class="spinner" style="width:40px; height:40px;"></div>
    <span>Carregando seus dados...</span>
</div>

<div id="app">
    <div class="topbar">
        <div class="logo"><span>💀 Estrada</span></div>
        <div style="display:flex; gap:12px; align-items:center;">
            <div><span id="creditsAmount">0</span> 🔥</div>
            <div class="avatar-circle" style="width:40px;height:40px;" onclick="navigateTo('perfil')"><span>💀</span></div>
        </div>
    </div>
    <div class="content">
        <div class="view active" id="viewHome">
            <div class="card">
                <div>Saldo de Tokens</div>
                <div id="bigCredits" style="font-size:48px; font-weight:800; color:#ff8c4a;">0</div>
                <div class="stats-row"><span>🎟️ Ingressos: <span id="ticketAmount">0</span></span><span>🏅 Confiança: <span id="trustScore">0</span></span></div>
                <div><span id="planBadge">Associado</span> <span id="statusBadge">✅ Adimplente</span></div>
            </div>
            <div class="grid-2col">
                <div onclick="navigateTo('qr')"><div class="avatar-circle" style="margin:auto;">📱</div><span>Meu QR</span></div>
                <div onclick="navigateTo('scanner')"><div class="avatar-circle" style="margin:auto;">📷</div><span>Escanear</span></div>
                <div onclick="navigateTo('checkin')"><div class="avatar-circle" style="margin:auto;">📍</div><span>Check-in</span></div>
                <div onclick="navigateTo('nf')"><div class="avatar-circle" style="margin:auto;">🧾</div><span>Nota Fiscal</span></div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
                <button class="btn btn-outline btn-sm" onclick="navigateTo('ranking')">🏅 Ranking</button>
                <button class="btn btn-outline btn-sm" onclick="navigateTo('chatGlobal')">💬 Mural</button>
                <button class="btn btn-outline btn-sm" onclick="logout()">🚪 Sair</button>
            </div>
        </div>

        <div class="view" id="viewQr"><div class="card"><h3>Meu QR Code</h3><div id="qrContainer" style="text-align:center; min-height:200px;"></div><button class="btn btn-primary" onclick="generateQR()">Gerar QR</button></div></div>
        <div class="view" id="viewScanner"><div class="card"><h3>Escanear QR</h3><div id="reader"></div><button class="btn btn-primary" id="btnStartScanner">Iniciar</button><button class="btn btn-outline" id="btnStopScanner" style="display:none;">Parar</button></div></div>
        <div class="view" id="viewPerfil"><div class="card"><h3>Meu Perfil</h3><input id="perfilNome" placeholder="Nome"><input id="perfilCpf" placeholder="CPF"><button class="btn btn-primary" onclick="salvarPerfil()">Salvar</button></div></div>
        <div class="view" id="viewCheckin"><div class="card"><h3>Check-in</h3><input type="file" id="checkinFoto" accept="image/*" capture="environment"><button class="btn btn-primary" id="checkinBtn">Registrar</button></div></div>
        <div class="view" id="viewNf"><div class="card"><h3>Nota Fiscal</h3><input id="valorNF" placeholder="Valor R$" type="number"><input type="file" id="nfFoto" accept="image/*"><button class="btn btn-primary" id="nfBtn">Validar</button></div></div>
        <div class="view" id="viewRanking"><div class="card"><h3>Ranking</h3><div id="rankingList"></div></div></div>
        <div class="view" id="viewChatGlobal"><div class="card"><h3>Mural</h3><div id="globalMural" style="max-height:300px; overflow-y:auto;"></div><input id="msgGlobal" placeholder="Mensagem"><button class="btn btn-primary" id="globalMsgBtn">Enviar</button></div></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item active" data-view="home" onclick="navigateTo('home')">🏠 Home</button>
        <button class="nav-item" data-view="qr" onclick="navigateTo('qr')">📱 QR</button>
        <button class="nav-item" data-view="checkin" onclick="navigateTo('checkin')">📍 Check</button>
        <button class="nav-item" data-view="perfil" onclick="navigateTo('perfil')">👤 Perfil</button>
    </div>
</div>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8",
        authDomain: "clube-de-vantagens-d748e.firebaseapp.com",
        projectId: "clube-de-vantagens-d748e",
        storageBucket: "clube-de-vantagens-d748e.firebasestorage.app",
        messagingSenderId: "774730191238",
        appId: "1:774730191238:web:9af24eddfafb18f1351c07"
    });
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userData = {};
    let html5QrScanner = null;

    function toast(msg, type) {
        const el = document.createElement('div');
        el.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
        el.textContent = msg;
        document.getElementById('toastStack').appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('emailLogin').value.trim();
        const pass = document.getElementById('senhaLogin').value;
        if (!email || !pass) return toast('Preencha os campos', 'error');
        try {
            await auth.signInWithEmailAndPassword(email, pass);
            toast('Login realizado com sucesso!', 'success');
        } catch (e) {
            toast(e.message, 'error');
        }
    };

    document.getElementById('registerBtn').onclick = async () => {
        const email = document.getElementById('emailLogin').value.trim();
        const pass = document.getElementById('senhaLogin').value;
        if (!email || !pass || pass.length < 6) return toast('E-mail e senha (mín. 6 caracteres)', 'error');
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pass);
            // Cria o perfil SEM consultar a coleção
            await db.collection('perfis').doc(cred.user.uid).set({
                email: email,
                cpf: '',
                credits: 500,
                trust: 0,
                role: 'admin',
                status: 'adimplente',
                perfil: { nome: email.split('@')[0] },
                tickets: 0,
                skillPoints: 10,
                plano: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            toast('Conta criada! Faça login.', 'success');
        } catch (e) {
            toast(e.message, 'error');
        }
    };

    window.logout = () => auth.signOut();

    auth.onAuthStateChanged(async user => {
        if (user) {
            document.getElementById('loadingData').style.display = 'flex';
            try {
                const userRef = db.collection('perfis').doc(user.uid);
                let docSnap = await userRef.get();
                
                // Se não existe, cria um novo documento diretamente
                if (!docSnap.exists) {
                    await userRef.set({
                        email: user.email,
                        cpf: '',
                        credits: 100,
                        trust: 0,
                        role: 'user',
                        status: 'adimplente',
                        perfil: { nome: user.email.split('@')[0] },
                        tickets: 0,
                        skillPoints: 0,
                        plano: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    docSnap = await userRef.get();
                }
                
                userData = { uid: user.uid, ...docSnap.data() };
                document.getElementById('loadingData').style.display = 'none';
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                
                // Atualiza UI
                document.getElementById('creditsAmount').textContent = userData.credits || 0;
                document.getElementById('bigCredits').textContent = userData.credits || 0;
                document.getElementById('ticketAmount').textContent = userData.tickets || 0;
                document.getElementById('trustScore').textContent = userData.trust || 0;
                document.getElementById('perfilNome').value = userData.perfil?.nome || '';
                document.getElementById('perfilCpf').value = userData.cpf || '';
                
                carregarRanking();
                carregarMural();
            } catch (err) {
                console.error(err);
                toast('Erro ao acessar seus dados. Verifique as regras do Firestore.', 'error');
                document.getElementById('loadingData').style.display = 'none';
                auth.signOut();
            }
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
            document.getElementById('loadingData').style.display = 'none';
        }
    });

    async function carregarRanking() {
        try {
            const snap = await db.collection('perfis').orderBy('trust', 'desc').limit(30).get();
            document.getElementById('rankingList').innerHTML = snap.docs.map((d, i) => {
                const u = d.data();
                return `<div>${i+1}. ${u.perfil?.nome || u.cpf || 'Anônimo'} - 🔥${u.credits || 0}</div>`;
            }).join('');
        } catch (e) {
            console.error('Erro ranking:', e);
        }
    }

    function carregarMural() {
        db.collection('globalChat').orderBy('data', 'desc').limit(20).onSnapshot(snap => {
            document.getElementById('globalMural').innerHTML = snap.docs.map(d => {
                const m = d.data();
                return `<div style="padding:8px; border-bottom:1px solid #333;"><strong>${m.nome || 'Anônimo'}</strong>: ${m.texto}</div>`;
            }).join('');
        });
    }

    document.getElementById('globalMsgBtn').onclick = async () => {
        const msg = document.getElementById('msgGlobal').value;
        if (!msg.trim()) return;
        await db.collection('globalChat').add({
            uid: userData.uid,
            nome: userData.perfil?.nome || 'Anônimo',
            texto: msg,
            data: new Date()
        });
        document.getElementById('msgGlobal').value = '';
    };

    async function salvarPerfil() {
        const nome = document.getElementById('perfilNome').value;
        const cpf = document.getElementById('perfilCpf').value;
        await db.collection('perfis').doc(userData.uid).update({
            'perfil.nome': nome,
            cpf: cpf
        });
        toast('Perfil salvo!', 'success');
    }

    window.generateQR = async () => {
        const qrDiv = document.getElementById('qrContainer');
        qrDiv.innerHTML = '';
        new QRCode(qrDiv, {
            text: JSON.stringify({ uid: userData.uid, timestamp: Date.now(), expiresAt: Date.now() + 300000 }),
            width: 180,
            height: 180
        });
        toast('QR gerado!', 'success');
    };

    document.getElementById('btnStartScanner').onclick = () => {
        document.getElementById('btnStartScanner').style.display = 'none';
        document.getElementById('btnStopScanner').style.display = '';
        html5QrScanner = new Html5Qrcode("reader");
        html5QrScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async (text) => {
                try {
                    const data = JSON.parse(text);
                    if (data.uid && data.expiresAt > Date.now()) {
                        await db.collection('perfis').doc(userData.uid).update({
                            credits: firebase.firestore.FieldValue.increment(50)
                        });
                        toast('QR validado! +50 créditos', 'success');
                        stopScanner();
                    }
                } catch (e) {
                    toast('QR inválido', 'error');
                }
            },
            () => {}
        ).catch(() => {
            stopScanner();
            toast('Erro na câmera', 'error');
        });
    };

    document.getElementById('btnStopScanner').onclick = stopScanner;

    function stopScanner() {
        if (html5QrScanner) {
            html5QrScanner.stop().catch(() => {});
            html5QrScanner = null;
        }
        document.getElementById('btnStartScanner').style.display = '';
        document.getElementById('btnStopScanner').style.display = 'none';
    }

    function navigateTo(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const el = document.getElementById('view' + view.charAt(0).toUpperCase() + view.slice(1));
        if (el) el.classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.nav-item[data-view="${view}"]`);
        if (btn) btn.classList.add('active');
        if (view === 'scanner') stopScanner();
    }
    window.navigateTo = navigateTo;
</script>
</body>
</html>
